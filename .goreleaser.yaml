version: 2

project_name: speclib

builds:
  - main: .
    binary: speclib
    env:
      - CGO_ENABLED=0
    # No windows: internal/source's mirror lock uses syscall.Flock, which has
    # no Windows equivalent short of a LockFileEx port. Add when someone needs it.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/jacob-meacham/speclib/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

changelog:
  use: github
